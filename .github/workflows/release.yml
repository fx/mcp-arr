name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Releases must never be cancelled part-way through: a run that has already
# tagged but not yet published would leave a tag with no package behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # release-please acts through the App token minted below, never through the
    # default workflow token, so this job needs no write scopes of its own.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request opened with the default GITHUB_TOKEN does not trigger
      # other workflows, so the release pull request would merge without ever
      # running CI. Acting as the App makes it an ordinary pull request.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          # The job-level permissions block scopes GITHUB_TOKEN, not this token,
          # so the App token is narrowed here instead: contents to tag and
          # release, pull requests to groom the release pull request, issues to
          # label it. A broader App installation grants this workflow nothing more.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # A release only exists once a maintainer has merged the release pull
    # request, which is the human action that authorizes publication.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm OIDC trusted publishing; no registry token is stored.
      id-token: write
    env:
      npm_config_engine_strict: "true"
      npm_config_strict_peer_deps: "true"
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # The gates run on the same Node.js version the CI workflow validates
      # against, so a release is published only from a commit that has passed
      # exactly the gates CI enforces.
      - name: Set up Node.js for the quality gates
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run quality gates
        run: npm run check
      # Trusted publishing requires npm >= 11.5.1 and Node.js >= 22.14.0
      # (https://docs.npmjs.com/trusted-publishers). Node.js 24 bundles a new
      # enough npm; the explicit upgrade keeps the floor from depending on
      # whatever the runner image happens to ship.
      - name: Set up Node.js for publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm to a trusted-publishing capable release
        run: npm install --global npm@^11.5.1
      # Provenance is attached automatically when npm authenticates over OIDC,
      # so no --provenance flag and no NPM_TOKEN are involved.
      - name: Publish to npm
        run: npm publish

  verify-image:
    # After the npm publish, so the image is built only for a release a
    # maintainer merged and only once that release passed the quality gates
    # the publish job runs on it. A skipped or failed publish skips this too.
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only: this job builds and runs the released code, and needs no
    # registry access to do it.
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.archive.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Choose the archive path
        run: echo "IMAGE_ARCHIVE=$RUNNER_TEMP/mcp-arr.oci.tar" >> "$GITHUB_ENV"
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Set up Node.js for the image scripts
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Read the build identity
        id: build-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      # The release version, its minor line, and latest. No bare major tag
      # while the package is 0.x: under semantic versioning every 0.x minor
      # may break, so `0` would move across breaking releases.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          # Stated here rather than taken from the repository's description,
          # which is empty and would override the Dockerfile's own label.
          labels: |
            org.opencontainers.image.description=An MCP server for Sonarr, Radarr, and Prowlarr over Streamable HTTP
          annotations: |
            org.opencontainers.image.description=An MCP server for Sonarr, Radarr, and Prowlarr over Streamable HTTP
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # The only build, as in the Docker workflow: one OCI archive of both
      # platforms, smoke-tested here and copied unchanged by publish-image.
      - name: Build the image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ env.IMAGE_ARCHIVE }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GIT_SHA=${{ steps.build-info.outputs.sha }}
            VERSION=${{ steps.build-info.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image archive
        id: archive
        run: node scripts/image-archive.mjs check "$IMAGE_ARCHIVE" >> "$GITHUB_OUTPUT"
      - name: Load the amd64 image from the archive
        run: node scripts/image-archive.mjs load "$IMAGE_ARCHIVE" linux/amd64 mcp-arr:verify-amd64
      - name: Verify the amd64 image
        run: node scripts/verify-image.mjs mcp-arr:verify-amd64
      - name: Load the arm64 image from the archive
        run: node scripts/image-archive.mjs load "$IMAGE_ARCHIVE" linux/arm64 mcp-arr:verify-arm64
      - name: Verify the arm64 image under emulation
        run: node scripts/verify-image.mjs mcp-arr:verify-arm64 --platform linux/arm64
      - name: Keep the verified archive for publishing
        uses: actions/upload-artifact@v7
        with:
          name: release-image-archive
          path: ${{ env.IMAGE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0

  publish-image:
    # Only the archive verify-image built and smoke-tested, copied to the
    # registry unchanged. This is the one job in the workflow that can write
    # to the container registry.
    needs: [release-please, verify-image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Set up Node.js for the image scripts
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          package-manager-cache: false
      - name: Download the verified archive
        uses: actions/download-artifact@v8
        with:
          name: release-image-archive
          path: ${{ runner.temp }}/image-archive
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the release image
        env:
          IMAGE_TAGS: ${{ needs.verify-image.outputs.tags }}
          IMAGE_DIGEST: ${{ needs.verify-image.outputs.digest }}
        run: node scripts/image-archive.mjs publish "$RUNNER_TEMP/image-archive/mcp-arr.oci.tar" "$IMAGE_DIGEST"
