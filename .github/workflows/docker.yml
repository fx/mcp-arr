name: Docker

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

# A pull request's superseded run is worthless and is cancelled. A run on main
# is never cancelled part-way through, so a development image is never left
# published for one platform and not the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # A release pull request changes only the version and the changelog; the
    # release workflow builds, verifies, and publishes that version's image
    # once it merges. The job-level condition reports the check as skipped
    # rather than absent.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only on every event. This job builds and runs code from the pull
    # request, so it never holds a token that can write to the registry.
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.archive.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Choose the archive path
        run: echo "IMAGE_ARCHIVE=$RUNNER_TEMP/mcp-arr.oci.tar" >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      # The image scripts run on the host, on the same Node.js version the
      # quality gates use; the verifier imports the MCP SDK for its protocol
      # version.
      - name: Set up Node.js for the image scripts
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Read the build identity
        id: build-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      # Development images only: a branch tag and a commit tag. Version tags
      # and latest are the release workflow's, and only a merged release
      # publishes them.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          # Stated here rather than taken from the repository's description,
          # which is empty and would override the Dockerfile's own label.
          labels: |
            org.opencontainers.image.description=An MCP server for Sonarr, Radarr, and Prowlarr over Streamable HTTP
          annotations: |
            org.opencontainers.image.description=An MCP server for Sonarr, Radarr, and Prowlarr over Streamable HTTP
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # The only build. Both platforms go into one OCI archive, which is what
      # the smoke tests below load and what the publish job copies to the
      # registry unchanged. Provenance is off so the index holds only the two
      # platform images, each of which is smoke-tested.
      - name: Build the image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ env.IMAGE_ARCHIVE }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GIT_SHA=${{ steps.build-info.outputs.sha }}
            VERSION=${{ steps.build-info.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image archive
        id: archive
        run: node scripts/image-archive.mjs check "$IMAGE_ARCHIVE" >> "$GITHUB_OUTPUT"
      - name: Load the amd64 image from the archive
        run: node scripts/image-archive.mjs load "$IMAGE_ARCHIVE" linux/amd64 mcp-arr:verify-amd64
      - name: Verify the amd64 image
        run: node scripts/verify-image.mjs mcp-arr:verify-amd64
      - name: Load the arm64 image from the archive
        run: node scripts/image-archive.mjs load "$IMAGE_ARCHIVE" linux/arm64 mcp-arr:verify-arm64
      - name: Verify the arm64 image under emulation
        run: node scripts/verify-image.mjs mcp-arr:verify-arm64 --platform linux/arm64
      - name: Keep the verified archive for publishing
        uses: actions/upload-artifact@v7
        with:
          name: image-archive
          path: ${{ env.IMAGE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces its own earlier upload.
          overwrite: true
          # The layers are already compressed.
          compression-level: 0

  publish:
    # Only a push to main publishes, and only the archive the verify job built
    # and smoke-tested: it is copied to the registry, never rebuilt. A pull
    # request never reaches this job, so its runs never hold registry write
    # access.
    needs: verify
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js for the image scripts
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          package-manager-cache: false
      - name: Download the verified archive
        uses: actions/download-artifact@v8
        with:
          name: image-archive
          path: ${{ runner.temp }}/image-archive
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every tag receives the verified index unchanged, and is read back to
      # prove it resolves to that digest.
      - name: Publish the development image
        env:
          IMAGE_TAGS: ${{ needs.verify.outputs.tags }}
          IMAGE_DIGEST: ${{ needs.verify.outputs.digest }}
        run: node scripts/image-archive.mjs publish "$RUNNER_TEMP/image-archive/mcp-arr.oci.tar" "$IMAGE_DIGEST"
